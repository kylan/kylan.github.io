title: Kylan Robinson
tagline: Father and engineer
description: Kylan Robinson is a father and engineer from Pullman, Washington.
url: https://kylanrobinson.com
lang: en_US
timezone: UTC

author: Kylan Robinson
email: me@kylanrobinson.com

# Handles already published in this config. The previous theme did not render them.
twitter:
  username: kylan
  card: summary
github_username: kylan
instagram_username: kylanrobinson
linkedin_username: kylanrobinson
telegram_username: kylanrobinson
keybase_username: kylanrobinson

social:
  name: Kylan Robinson
  links:
    - https://github.com/kylan
    - https://www.linkedin.com/in/kylanrobinson
    - https://www.instagram.com/kylanrobinson
    - https://twitter.com/kylan
    - https://t.me/kylanrobinson
    - https://keybase.io/kylanrobinson

# Keep Jekyll's default permalinks so existing /year/month/day/title.html URLs stay valid.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-redirect-from

redirect_from:
  json: false

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/headshot.jpg
  - scope:
      type: posts
    values:
      sitemap: false
      noindex: true

include:
  - .well-known
